name: Verify PStack setup

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      # Node expands the quoted glob itself, because PowerShell on the Windows runner does not.
      - run: node --test 'scripts/*.test.mjs'
      - run: node scripts/check-handoffs.mjs
      - run: node scripts/pstack.mjs setup
      - run: node scripts/pstack.mjs setup
      - name: Parse Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/agent.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Forward Windows launcher arguments
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fakeClients = Join-Path $env:RUNNER_TEMP 'fake-clients'
          New-Item -ItemType Directory -Force -Path $fakeClients | Out-Null
          Set-Content (Join-Path $fakeClients 'argv.js') 'console.log(JSON.stringify(process.argv.slice(2)))'
          Set-Content (Join-Path $fakeClients 'claude.cmd') '@node "%~dp0argv.js" %*'
          $env:PATH = "$fakeClients;$env:PATH"
          $expected = '["--setting-sources","project,local","-p","Reply OK","-c","--allowedTools","Read,Edit"]'
          foreach ($shell in 'pwsh', 'powershell') {
              $fileOutput = @(& $shell -NoProfile -NonInteractive -File scripts/agent.ps1 claude -p 'Reply OK' -c --allowedTools Read,Edit)
              if ($LASTEXITCODE -ne 0 -or $fileOutput[-1] -cne $expected) { throw "$shell -File forwarded: $fileOutput" }
              $commandOutput = @(& $shell -NoProfile -NonInteractive -Command "& ./scripts/agent.ps1 claude -p 'Reply OK' -c --allowedTools Read,Edit")
              if ($LASTEXITCODE -ne 0 -or $commandOutput[-1] -cne $expected) { throw "$shell -Command forwarded: $commandOutput" }
              $unknownOutput = & $shell -NoProfile -NonInteractive -File scripts/agent.ps1 unknown 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0 -or $unknownOutput -notmatch "Unknown client 'unknown'") { throw "$shell did not reject an unknown client: $unknownOutput" }
              $missingOutput = & $shell -NoProfile -NonInteractive -File scripts/agent.ps1 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0 -or $missingOutput -notmatch 'Missing client') { throw "$shell did not reject a missing client: $missingOutput" }
          }
          # The runner exits with LASTEXITCODE, which the expected rejection above left nonzero.
          exit 0
