name: Verify PStack setup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node --check scripts/codex-skills.mjs
      - run: node scripts/pstack.mjs setup
      - run: node scripts/pstack.mjs setup
      - run: node scripts/pstack.mjs check
      - name: Parse Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/agent.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Forward Windows launcher arguments
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fakeClients = Join-Path $env:RUNNER_TEMP 'fake-clients'
          New-Item -ItemType Directory -Force -Path $fakeClients | Out-Null
          Set-Content (Join-Path $fakeClients 'argv.js') 'console.log(JSON.stringify(process.argv.slice(2)))'
          Set-Content (Join-Path $fakeClients 'claude.cmd') '@node "%~dp0argv.js" %*'
          $env:PATH = "$fakeClients;$env:PATH"
          $expected = '["--setting-sources","project,local","-p","Reply OK","-c","--model","m"]'
          foreach ($shell in 'pwsh', 'powershell') {
              $fileOutput = @(& $shell -NoProfile -NonInteractive -File scripts/agent.ps1 claude -p 'Reply OK' -c --model m)
              if ($LASTEXITCODE -ne 0 -or $fileOutput[-1] -ne $expected) { throw "$shell -File forwarded: $fileOutput" }
              $commandOutput = @(& $shell -NoProfile -NonInteractive -Command "& ./scripts/agent.ps1 claude -p 'Reply OK' -c --model m")
              if ($LASTEXITCODE -ne 0 -or $commandOutput[-1] -ne $expected) { throw "$shell -Command forwarded: $commandOutput" }
              & $shell -NoProfile -NonInteractive -File scripts/agent.ps1 unknown
              if ($LASTEXITCODE -eq 0) { throw "$shell accepted an unknown client" }
              & $shell -NoProfile -NonInteractive -File scripts/agent.ps1
              if ($LASTEXITCODE -eq 0) { throw "$shell accepted a missing client" }
          }
          # The runner exits with LASTEXITCODE, which the expected rejection above left nonzero.
          exit 0
