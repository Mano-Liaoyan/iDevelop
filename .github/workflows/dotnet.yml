# Builds and tests on Windows and macOS, only for a release tag or when started by hand.
name: Build and test (Windows, macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: dotnet restore --locked-mode
      - run: node scripts/check-licenses.mjs
      - run: node scripts/planweave-tokens.mjs --check
      - run: node scripts/fluent-icons.mjs --check
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
