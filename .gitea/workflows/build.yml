# Builds and tests on Linux for every push to main and every pull request, on the self-hosted Gitea runner. A branch
# builds once, through its pull request, not again for its push.
# Gitea runs only this directory's workflows; .github/workflows/dotnet.yml builds Windows and macOS on GitHub for
# release tags.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      # The desktop tests measure text, and pass with Roboto as the sans-serif font, as on the owner's machine. The
      # runner image has only DejaVu, which is wider, so the inspector's buttons wrap at 280 px.
      - name: Make Roboto the sans-serif font
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-roboto
          cat > /etc/fonts/local.conf <<'XML'
          <?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig><alias><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias></fontconfig>
          XML
          fc-cache -f > /dev/null
          fc-match sans-serif
      # The job container runs as root, which ignores the file permissions some tests rely on to make a write fail,
      # so the rest runs as an unprivileged user, as on GitHub's runners.
      - run: |
          useradd --create-home builder
          chown -R builder:builder .
      - run: runuser -u builder -- dotnet restore --locked-mode
      - run: runuser -u builder -- node scripts/check-licenses.mjs
      - run: runuser -u builder -- node scripts/planweave-tokens.mjs --check
      - run: runuser -u builder -- node scripts/fluent-icons.mjs --check
      - run: runuser -u builder -- dotnet build -c Release --no-restore
      - run: runuser -u builder -- dotnet test -c Release --no-build
